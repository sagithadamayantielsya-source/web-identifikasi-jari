<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deteksi Jari 3 dan 5</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent2: #a78bfa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e1b4b);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background: var(--card);
    border-radius: 20px;
    padding: 32px 28px;
    width: 100%;
    max-width: 440px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
  }
  h1 { font-size: 1.5rem; margin-bottom: 6px; }
  .subtitle { color: var(--muted); font-size: .9rem; margin-bottom: 22px; }
  #webcam-container {
    width: 300px; height: 300px;
    max-width: 100%;
    margin: 0 auto 20px;
    border-radius: 16px;
    background: #0b1220;
    border: 2px dashed #334155;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    color: var(--muted);
    font-size: .9rem;
  }
  #webcam-container canvas { width: 100%; height: 100%; display: block; }
  button {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #0f172a;
    border: none;
    padding: 12px 36px;
    font-size: 1rem;
    font-weight: 700;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .15s, opacity .15s;
  }
  button:hover { transform: translateY(-2px); }
  button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  #status { margin-top: 14px; font-size: .85rem; color: var(--muted); min-height: 1.2em; }
  #hasil {
    margin: 22px 0 14px;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--accent);
    min-height: 2em;
  }
  .bar-row { text-align: left; margin-bottom: 12px; }
  .bar-label { display: flex; justify-content: space-between; font-size: .9rem; margin-bottom: 4px; }
  .bar-bg { background: #0b1220; border-radius: 999px; height: 12px; overflow: hidden; }
  .bar-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 999px;
    transition: width .15s;
  }
  footer { margin-top: 22px; font-size: .75rem; color: var(--muted); }
</style>
</head>
<body>

<div class="container">
  <h1>✋ Identifikasi Jari 3 dan 5</h1>
  <p class="subtitle">Model Teachable Machine – Tugas Mata Kuliah Kecerdasan Buatan</p>

  <div id="webcam-container">Kamera belum aktif</div>

  <button type="button" id="btnStart" onclick="init()">Mulai Kamera</button>
  <div id="status"></div>

  <div id="hasil"></div>
  <div id="label-container"></div>

  <footer>Tunjukkan 3 jari atau 5 jari di depan kamera.</footer>
</div>

<!-- Library Teachable Machine (versi dipatenkan agar stabil) -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
<script type="text/javascript">
    // Folder berisi model.json, metadata.json, dan weights.bin
    const URL = "./my_model/";

    let model, webcam, labelContainer, maxPredictions;

    // Load model dan aktifkan webcam
    async function init() {
        const btn = document.getElementById("btnStart");
        const status = document.getElementById("status");
        btn.disabled = true;
        status.textContent = "Memuat model...";

        try {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const flip = true; // mirror kamera
            webcam = new tmImage.Webcam(300, 300, flip); // lebar, tinggi, flip
            status.textContent = "Meminta izin kamera...";
            await webcam.setup();
            await webcam.play();
            window.requestAnimationFrame(loop);

            const wc = document.getElementById("webcam-container");
            wc.innerHTML = "";
            wc.style.border = "2px solid #334155";
            wc.appendChild(webcam.canvas);

            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = "";
            for (let i = 0; i < maxPredictions; i++) {
                const row = document.createElement("div");
                row.className = "bar-row";
                row.innerHTML =
                    '<div class="bar-label"><span class="nm"></span><span class="pc"></span></div>' +
                    '<div class="bar-bg"><div class="bar-fill"></div></div>';
                labelContainer.appendChild(row);
            }
            status.textContent = "Kamera aktif ✔";
            btn.textContent = "Berjalan...";
        } catch (err) {
            console.error(err);
            status.textContent = "Gagal: " + err.message +
                " (pastikan izin kamera diberikan & halaman dibuka lewat https/localhost)";
            btn.disabled = false;
        }
    }

    async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    // Prediksi gambar webcam
    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        let best = prediction[0];
        for (let i = 0; i < maxPredictions; i++) {
            const p = prediction[i];
            if (p.probability > best.probability) best = p;
            const row = labelContainer.childNodes[i];
            row.querySelector(".nm").textContent = p.className;
            row.querySelector(".pc").textContent = (p.probability * 100).toFixed(0) + "%";
            row.querySelector(".bar-fill").style.width = (p.probability * 100) + "%";
        }
        document.getElementById("hasil").textContent =
            best.probability > 0.6 ? "Terdeteksi: " + best.className : "Mendeteksi...";
    }
</script>
</body>
</html>
